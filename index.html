<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>E's Food For The Soul Menu Card</h1>
    
      <form id="menu-form">
         <label for="menu-input">Paste your menu as JSON</label>
         <!-- JSON menu -->
         <textarea id="menu-input" rows="8">
          [
            {"name": "3pc Fish", "price" : 15.99},
            {"name": "12pc Shrimp", "price" : 17.99},
            {"name": "3pc Chicken", "price" : 8.99},
            {"name": "16oz Chicken & Sausage Gumbo", "price" : 9.99}
          ]
         </textarea>
         <button type="submit">Show my menu</button>
      </form>
    <p id="count"></p>
    <p id="menu-text"></p>



    <script src="script.js"></script>
</body>


</html>
